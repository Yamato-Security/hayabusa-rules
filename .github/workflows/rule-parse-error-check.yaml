name: Rule parse error check

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  rule-parse-error-check:
    runs-on: ubuntu-latest
    steps:
      - name: clone hayabusa rule repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: hayabusa-rules

      - name: clone hayabusa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yamato-Security/hayabusa
          submodules: recursive
          path: hayabusa

      - name: clone hayabusa-sample-evtx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yamato-Security/hayabusa-sample-evtx
          path: hayabusa-sample-evtx

      - name: run dfir-timeline
        run: |
            cd hayabusa
            git fetch --prune --unshallow
            LATEST_VER=`git describe --tags --abbrev=0`
            URL="https://github.com/Yamato-Security/hayabusa/releases/download/${LATEST_VER}/hayabusa-${LATEST_VER#v}-lin-x64-gnu.zip"
            mkdir tmp
            cd tmp
            curl -OL $URL
            unzip *.zip
            chmod +x hayabusa-${LATEST_VER#v}-lin-x64-gnu
            ./hayabusa-${LATEST_VER#v}-lin-x64-gnu dfir-timeline -d ../../hayabusa-sample-evtx -r ../../hayabusa-rules -w -o out.csv -D -n -u

      - name: check dfir-timeline result
        if: ${{!inputs.disable-rule-parse-error-check }}
        shell: /usr/bin/bash {0}
        run: |
          cd hayabusa
          LATEST_VER=`git describe --tags --abbrev=0`
          cd tmp
          ./hayabusa-${LATEST_VER#v}-lin-x64-gnu dfir-timeline -d ../../hayabusa-sample-evtx -r ../../hayabusa-rules -w -o out.csv -D -n -u  -C | grep "Rule parsing error" | wc -l | grep 0
          if [ $? -eq 0 ]; then
              echo "No rule parse error."
              echo "RULE_PARSE_ERROR=0" >> $GITHUB_ENV
          else
              cat ./logs/*
              echo "RULE_PARSE_ERROR=1" >> $GITHUB_ENV
          fi
          exit 0

      - name: Notify Slack
        if: env.RULE_PARSE_ERROR == '1'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":no_entry: Failed GitHub Actions\nWorkflow: ${{ github.workflow }}\nJob: ${{ github.job }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: check rule parse error status
        if: env.RULE_PARSE_ERROR == '1'
        run: |
          echo "Rule parse error found. Please check the logs above."
          exit 1
