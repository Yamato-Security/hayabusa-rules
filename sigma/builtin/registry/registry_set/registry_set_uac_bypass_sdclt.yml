title: UAC Bypass via Sdclt
id: 4e8bf251-fcde-0996-45f9-62335b5e5d8b
related:
    - id: 5b872a46-3b90-45c1-8419-f675db8053aa
      type: derived
status: test
description: Detects the pattern of UAC Bypass using registry key manipulation of sdclt.exe (e.g. UACMe 53)
references:
    - https://enigma0x3.net/2017/03/17/fileless-uac-bypass-using-sdclt-exe/
    - https://github.com/hfiref0x/UACME
author: Omer Yampel, Christian Burkard (Nextron Systems)
date: 2017-03-17
modified: 2026-11-12
tags:
    - attack.privilege-escalation
    - attack.t1548.002
    - car.2019-04-001
logsource:
    category: registry_set
    product: windows
detection:
    registry_set:
        EventID: 4657
        Channel: Security
    selection1:
        ObjectName|endswith: Software\Classes\exefile\shell\runas\command\isolatedCommand
    selection2:
        ObjectName|endswith: Software\Classes\Folder\shell\open\command\SymbolicLinkValue
        NewValue|re: -1[0-9]{3}\\Software\\Classes\\
    filter_main_isolatedcommand_deffault:
        ObjectName|endswith: SOFTWARE\Classes\exefile\shell\runas\command\IsolatedCommand
        NewValue:
            - '"%%1" %%\*'
            - '"%1" %\*'
    filter_optional_container_worker:
        ProcessName|startswith:
            - C:\Windows\System32\
            - C:\Windows\SysWOW64\
            - C:\Windows\WinSxS\
        ProcessName|endswith: \containerworker.exe
        ObjectName|contains: \Windows\Containers\Layers\
    condition: registry_set and (1 of selection* and not 1 of filter_main_* and not 1 of filter_optional_*)
falsepositives:
    - Unknown
level: high
ruletype: Sigma
