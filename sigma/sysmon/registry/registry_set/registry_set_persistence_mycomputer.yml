title: Potential Persistence Via MyComputer Registry Keys
id: 36c5c4f3-63f6-c166-6d8b-57e6b239e0c8
related:
    - id: 8fbe98a8-8f9d-44f8-aa71-8c572e29ef06
      type: derived
status: test
description: Detects modification to the "Default" value of the "MyComputer" key and subkeys to point to a custom binary that will be launched whenever the associated action is executed (see reference section for example)
references:
    - https://www.hexacorn.com/blog/2017/01/18/beyond-good-ol-run-key-part-55/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-09
modified: 2026-11-16
tags:
    - attack.persistence
    - sysmon
logsource:
    category: registry_set
    product: windows
detection:
    registry_set:
        EventID: 13
        Channel: Microsoft-Windows-Sysmon/Operational
    selection:
        TargetObject|contains: \Microsoft\Windows\CurrentVersion\Explorer\MyComputer
        TargetObject|endswith: path\(Default)
    filter_main_default:
        Details|startswith:
            - '%%SystemRoot%%\'
            - '%%Windir%%\'
            - '%SystemRoot%\'
            - '%Windir%\'
            - C:\Windows\
    filter_main_path_backup:
        TargetObject|endswith: \MyComputer\BackupPath\(Default)
        Details|endswith:
            - \System32\sdclt.exe
            - \SysWOW64\sdclt.exe
    filter_main_path_cleanup:
        TargetObject|endswith: \MyComputer\cleanuppath\(Default)
        Details|endswith:
            - \System32\cleanmgr.exe /D %c
            - \SysWOW64\cleanmgr.exe /D %c
            - \System32\cleanmgr.exe /D %%c
            - \SysWOW64\cleanmgr.exe /D %%c
    filter_main_path_defrag:
        TargetObject|endswith: \MyComputer\DefragPath\(Default)
        Details|endswith:
            - \System32\dfrgui.exe
            - \SysWOW64\dfrgui.exe
    condition: registry_set and (selection and not (filter_main_default and 1 of filter_main_path_*))
falsepositives:
    - Unlikely but if you experience FPs add specific processes and locations you would like to monitor for
level: high
ruletype: Sigma
